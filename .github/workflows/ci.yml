name: ci

on:
  push:
    branches: [main]
  pull_request:
  # For the `drift` job below only — it must not run on a PR, and a schedule
  # cannot be triggered by hand when you want to check it.
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      force_drift_failure:
        description: >-
          Fail the drift job deliberately, to exercise the failure notifier.
          The point of the notifier is that an unread signal is not a signal;
          an untested notifier is the same bug one layer up, so there has to be
          a way to make it fire on demand.
        type: boolean
        default: false

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

# The EVENT is part of the group, and cancellation is limited to PRs.
#
# `github.ref` alone is not enough: on a `schedule` event it is the DEFAULT
# BRANCH ref — the same value a push to main has — so a merge landing during
# the Monday drift run would cancel it. A cancelled run is not a failure: it
# reports nothing and looks like nothing happened, which is precisely how a
# drift signal stops arriving without anyone noticing. That is the same failure
# the drift job exists to prevent, arriving by another route. (gold-man, r1 O3.)
#
# cancel-in-progress is kept for pull_request, where a superseded run proves
# nothing about the head that replaced it, and dropped everywhere else, where
# each commit deserves its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# auto-finder had no automated gate. `tests/run-all.sh` already turns a silent
# abort into a loud failure — it parses each suite's summary line and treats its
# ABSENCE as a hard failure, which is the only thing that catches a C-level
# crash mid-run. CI does not reimplement that; it supplies the environment and
# lets the runner be the judge.
jobs:
  lua:
    runs-on: ubuntu-latest
    # Generous because this is the largest suite in the family (17 test files).
    # It bounds a hung job rather than expressing an expected duration.
    timeout-minutes: 25
    steps:
      # Pinned by commit SHA, not by tag: a tag can be moved to different code
      # under the same name.
      #
      # Deliberately NO branch-restoring step and no fetch-depth: 0. auto-core's
      # workflow needs both because its suites read its own refs; these read
      # none. Keeping `push` and `pull_request` behaviourally IDENTICAL is the
      # point: the step auto-core needs there is the one that exits 128 here
      # (actions/checkout checks the branch out on push rather than detaching),
      # and an entry whose first firing is the merge cannot be witnessed
      # beforehand — so the fix is to remove the per-entry difference.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install neovim
        env:
          # Pinned by VERSION AND CHECKSUM. A GitHub release asset can be
          # replaced under the same tag and name, so the version alone is not
          # reproducible; the SHA-256 is the real pin. v0.12.5 is the version
          # these suites were verified against locally. Recompute when bumping.
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          # --retry: a transient network blip should not fail a PR for reasons
          # unrelated to its change.
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # All pinned by commit, so an upstream change cannot become a mystery
      # failure on an unrelated PR here. The cost of that pin — a consumer
      # frozen against its dependencies can never observe an upstream
      # regression — is paid by the `drift` job below, not by weakening this.
      - name: install plugin dependencies
        env:
          # Bumped v0.2.15 -> v0.2.18 DELIBERATELY, because this repo's tests
          # now require it: p40e pins "assignment does not move a task", which
          # auto-core only started guaranteeing at 86b0897 (ADR-0035 r5). The
          # old pin predates that contract, so the cell failed on CI while
          # passing everywhere else — the pin asserting an auto-core three
          # releases old.
          #
          # A pin is still MANUAL and must stay so: a gating job that changes
          # under a PR reintroduces exactly the mystery failure on unrelated
          # work that pinning exists to prevent. This is a reviewed bump to a
          # TAGGED release, not an automatic one, and the drift job remains the
          # thing that notices when it goes stale again. (gold-man, #28 r0 Q2.)
          AUTO_CORE_REF: "f07e2c2c66a6859408b7876ea1cd82ce2d8c3f07"  # main @ v0.2.18
          WORKTREE_REF:  "1aedccca735b42b43b68f4e4f246669075ce03ae"
          AUTO_RUN_REF:  "11f2cd836d01abcdaf765b894994fba6b03eb291"
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
          NUI_REF:       "10fc361835c856ba4233ef5ea135b919bf3dce97"
          NVIM_DAP_REF:  "c9a0738e45f1bd41d792a126941348dce661cf9b"
        run: ./.github/install-deps.sh

      # A runner's Neovim ships parsers for c, lua, vim, vimdoc, markdown and
      # query ONLY. Everything else is something a developer installed once and
      # stopped seeing — which is exactly how this stayed invisible: the suite
      # was green on every machine with a parser lying around, and the first
      # runner without one failed the rendering cells while reporting the scan
      # as "complete". It completed, having found nothing.
      #
      # `go` only. The tests view delegates discovery to auto-run, and
      # smoke-adr0048 is the one suite here that builds a language fixture — a Go
      # one. There are no JS/TS fixtures anywhere in this tree, so auto-run's
      # other three grammars are not this repo's dependency.
      - name: install tree-sitter parsers
        env:
          LANGS: "go"
        run: ./.github/install-parsers.sh

      # Named "assert", not "verify", because it CAN fail: it compares the
      # running nvim against the pin, and checks BOTH resolution shapes the
      # suites use. A step named "verify" that only prints a version is the
      # present-and-blind shape — it converts "nobody checked" into "checked
      # and fine".
      - name: assert the toolchain and both dependency shapes
        env:
          NVIM_VERSION: "v0.12.5"
        run: |
          got="$(nvim --version | head -1 | awk '{print $2}')"
          echo "nvim: $got (pinned $NVIM_VERSION)"
          test "$got" = "$NVIM_VERSION"
          lazy="$HOME/.local/share/nvim/lazy"
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          for d in plenary.nvim nui.nvim nvim-dap auto-core.nvim worktree.nvim; do
            test -d "$lazy/$d" || { echo "missing lazy/$d" >&2; exit 1; }
          done
          for d in auto-core.nvim worktree.nvim auto-run.nvim; do
            test -d "$siblings/$d/main" || { echo "missing sibling $d/main" >&2; exit 1; }
          done

      # The pin's age as ROUTINE INFORMATION, not something discovered while
      # debugging. This job's pin comment read `# main @ v0.2.15` while sitting
      # eighteen commits and three releases behind, and the way that surfaced
      # was a cell failing on CI while passing everywhere else.
      #
      # Reported, never acted on: auto-bumping the pin would defeat the
      # reproducibility it exists for — a gating job that changes under a PR
      # reintroduces the mystery failure on unrelated work that pinning was
      # adopted to prevent. The bump is a human's call, and a reviewed one.
      - name: report how stale the auto-core pin is
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_CORE_REF: "f07e2c2c66a6859408b7876ea1cd82ce2d8c3f07"
        run: |
          # One API call rather than a second clone: compare gives the distance
          # to the default branch directly.
          cmp="$(gh api "repos/yongjohnlee80/auto-core.nvim/compare/${AUTO_CORE_REF}...main" \
                  --jq '{behind: .behind_by, ahead: .ahead_by}' 2>/dev/null || echo '{}')"
          behind="$(printf '%s' "$cmp" | sed -n 's/.*"behind":[ ]*\([0-9]*\).*/\1/p')"
          echo "auto-core pin: ${AUTO_CORE_REF}"
          echo "commits on auto-core main that this pin does NOT have: ${behind:-unknown}"
          if [ -n "$behind" ] && [ "$behind" -gt 0 ]; then
            msg="the gating job tests a pinned auto-core; the drift job is what notices when the pin goes stale, and bumping it is a deliberate reviewed change, never automatic"
            echo "::notice title=auto-core pin is ${behind} commits behind main::${msg}"
          fi

      - name: tests/run-all.sh
        run: ./tests/run-all.sh

  # CONSUMER DRIFT.
  #
  # The reason auto-core got CI first is that a regression there reaches its
  # consumers before anyone notices — and a consumer pinned to a frozen
  # auto-core is precisely the thing that cannot notice. Both properties are
  # wanted and they conflict, so they are split rather than traded: `lua` pins
  # and gates, this resolves auto-core at its DEFAULT BRANCH.
  #
  # Schedule and manual dispatch ONLY — deliberately not `push`. On push it
  # would redden the merge run for an upstream change unrelated to the PR being
  # merged, and would put a code path on the merge that no PR run exercised.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Raised for THIS JOB ONLY, and only by one step: a failing drift run has to
    # be able to reach a person. The `lua` job keeps the workflow's read-only
    # default.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install neovim
        env:
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The ONE difference from `lua`: auto-core rides its default branch.
      # Everything else stays pinned, so a failure here names auto-core rather
      # than "something moved".
      - name: install plugin dependencies (auto-core at HEAD)
        env:
          AUTO_CORE_REF: ""   # empty => default branch
          WORKTREE_REF:  "1aedccca735b42b43b68f4e4f246669075ce03ae"
          AUTO_RUN_REF:  "11f2cd836d01abcdaf765b894994fba6b03eb291"
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
          NUI_REF:       "10fc361835c856ba4233ef5ea135b919bf3dce97"
          NVIM_DAP_REF:  "c9a0738e45f1bd41d792a126941348dce661cf9b"
        run: ./.github/install-deps.sh

      # A runner's Neovim ships parsers for c, lua, vim, vimdoc, markdown and
      # query ONLY. Everything else is something a developer installed once and
      # stopped seeing — which is exactly how this stayed invisible: the suite
      # was green on every machine with a parser lying around, and the first
      # runner without one failed the rendering cells while reporting the scan
      # as "complete". It completed, having found nothing.
      #
      # `go` only. The tests view delegates discovery to auto-run, and
      # smoke-adr0048 is the one suite here that builds a language fixture — a Go
      # one. There are no JS/TS fixtures anywhere in this tree, so auto-run's
      # other three grammars are not this repo's dependency.
      - name: install tree-sitter parsers
        env:
          LANGS: "go"
        run: ./.github/install-parsers.sh

      - name: report which auto-core is under test
        run: |
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          git -C "$siblings/auto-core.nvim/main" log --oneline -1

      # Exercisable on demand. The whole point of the step below is that an
      # unread signal is not a signal — so an untested notifier is the same bug
      # one layer up, and there has to be a way to make it fire without waiting
      # for auto-core to break something.
      - name: force a drift failure (notifier self-test)
        if: inputs.force_drift_failure
        run: |
          echo "force_drift_failure was requested: failing deliberately so the"
          echo "notifier below has something to report."
          exit 1

      - name: tests/run-all.sh
        run: ./tests/run-all.sh

      # THE ADDRESSEE. Without this a red scheduled run is a row in the Actions
      # tab that nobody is obliged to open — and the one time this job caught a
      # real regression, it was caught because somebody dispatched it BY HAND
      # while investigating something unrelated. Left to the schedule it would
      # have gone red and sat there.
      #
      # An issue rather than a notification, for two reasons: it has an
      # addressee that outlives a run's retention, and it records WHEN
      # divergence started, which a red run does not.
      #
      # One issue per repo, reopened and commented rather than duplicated, so a
      # month of Mondays is a thread instead of four issues nobody triages.
      - name: open or update the drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title="CI drift: this repo's suite fails against auto-core@main"
          body="$(printf '%s\n' \
            "The \`drift\` job resolves auto-core at its DEFAULT BRANCH instead of the pinned commit the gating job uses, and it failed." \
            "" \
            "Run: ${RUN_URL}" \
            "Event: ${GITHUB_EVENT_NAME}  Commit: ${GITHUB_SHA}" \
            "" \
            "This does NOT mean this repo is broken for its users — the gating job pins auto-core and is green. It means auto-core has moved in a way this suite does not accept yet, and one of the two has to change before the pin is bumped." \
            "" \
            "Bumping the pin is a deliberate, reviewed decision and never automatic: a gating job that changes under a PR reintroduces the mystery failure on unrelated work that pinning exists to prevent.")"
          num="$(gh issue list --state all --limit 50 --json number,title \
                  --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$num" ]; then
            gh issue reopen "$num" >/dev/null 2>&1 || true
            gh issue comment "$num" --body "$body"
            echo "commented on existing drift issue #$num"
          else
            gh issue create --title "$title" --body "$body"
          fi
